name: Apply admin users hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-admin-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standalone loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('standalone.html')
          s=p.read_text()
          tag='<script src="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@main/assets/admin-hotfix.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          git config user.name 'CALEGO Production Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add standalone.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: activar token explícito para usuarios'
          git push
