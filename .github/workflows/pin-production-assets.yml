name: Pin production assets

on:
  push:
    paths:
      - '.github/workflows/pin-production-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin browser assets to tested commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('standalone.html')
          s=p.read_text()
          commit='96a0d809dcde7a8da84b6104cc1d899531a352a2'
          s=re.sub(r'@[^/]+/assets/style\.css',f'@{commit}/assets/style.css',s)
          s=re.sub(r'@[^/]+/assets/app\.js',f'@{commit}/assets/app.js',s)
          s=re.sub(r'@[^/]+/assets/admin-hotfix\.js',f'@{commit}/assets/admin-hotfix.js',s)
          p.write_text(s)
          PY
      - name: Commit pinned production HTML
        shell: bash
        run: |
          git config user.name 'CALEGO Production'
          git config user.email 'actions@users.noreply.github.com'
          git add standalone.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: fijar hotfix estable de sesión y claves'
          git push
