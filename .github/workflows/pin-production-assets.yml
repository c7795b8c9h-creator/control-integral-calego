name: Pin production assets

on:
  push:
    paths:
      - '.github/workflows/pin-production-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin browser assets to tested commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('standalone.html')
          s=p.read_text()
          commit='1616a36dcdca2b8e0d9521952b40b1cb54dc6b87'
          s=s.replace('@main/assets/style.css',f'@{commit}/assets/style.css')
          s=s.replace('@main/assets/app.js',f'@{commit}/assets/app.js')
          s=s.replace('@main/assets/admin-hotfix.js',f'@{commit}/assets/admin-hotfix.js')
          p.write_text(s)
          PY
      - name: Commit pinned production HTML
        shell: bash
        run: |
          git config user.name 'CALEGO Production'
          git config user.email 'actions@users.noreply.github.com'
          git add standalone.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: fijar assets estables de sesión'
          git push
