name: Sync production bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-production.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current production bundle
        shell: bash
        run: |
          set -euo pipefail
          base='https://control-integral-calego.vercel.app'
          for f in index.html style.txt app0.txt app1.txt app2.txt app3.txt app4.txt; do
            curl --fail --silent --show-error --location "$base/$f" --output "$f"
            test -s "$f"
          done

      - name: Build browser-compatible source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 -d style.txt | gzip -dc > assets/style.css
          cat app0.txt app1.txt app2.txt app3.txt app4.txt | base64 -d | gzip -dc > assets/app.js
          test -s assets/style.css
          test -s assets/app.js

      - name: Build robust production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          start = html.find('<script>(async()=>{')
          if start < 0:
              raise SystemExit('No se encontró el cargador comprimido')
          end = html.find('</script>', start)
          if end < 0:
              raise SystemExit('No se encontró cierre del cargador')
          end += len('</script>')
          tags = '''<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@main/assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@main/assets/app.js"></script>'''
          html = html[:start] + tags + html[end:]
          Path('standalone.html').write_text(html)
          PY
          grep -q 'qrcode@1.5.1/build/qrcode.min.js' standalone.html
          ! grep -q 'DecompressionStream' standalone.html
          grep -q 'assets/app.js' standalone.html

      - name: Commit synchronized production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CALEGO Production Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html style.txt app0.txt app1.txt app2.txt app3.txt app4.txt assets/app.js assets/style.css standalone.html
          if git diff --cached --quiet; then
            echo 'Production bundle already synchronized.'
            exit 0
          fi
          git commit -m 'fix: generar frontend compatible sin descompresión en navegador'
          git push
