<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B3459">
  <title>CALEGO · Control Integral · Preview V7</title>
  <style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8fc;color:#1B3459}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot b{display:block;font-size:22px}.boot small{display:block;margin-top:8px;color:#68778c}</style>
</head>
<body>
  <div class="boot"><div><b>CALEGO · Control Integral</b><small>Cargando PREVIEW V7…</small></div></div>
  <script>
    (async()=>{
      try{
        const base='https://raw.githubusercontent.com/c7795b8c9h-creator/control-integral-calego/main/standalone.html';
        const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar la base ('+r.status+')');
        let h=await r.text();
        const ref='b47904a3e4f771f4560cf4d5d76eeee2fb603b51';
        const extra=`<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@${ref}/assets/preview-v7.css"><script src="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@${ref}/assets/preview-photo-v7.js"><\/script><script src="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@${ref}/assets/preview-dashboard-v7.js"><\/script><script src="https://cdn.jsdelivr.net/gh/c7795b8c9h-creator/control-integral-calego@${ref}/assets/preview-flow-v7.js"><\/script>`;
        h=h.replace('</body>',extra+'</body>').replace('<title>CALEGO · Control Integral</title>','<title>CALEGO · Control Integral · Preview V7</title>');
        document.open();document.write(h);document.close();
      }catch(e){document.body.innerHTML='<div class="boot"><div><b>No se pudo abrir la preview</b><small>'+String(e.message||e)+'</small></div></div>'}
    })();
  </script>
</body>
</html>
